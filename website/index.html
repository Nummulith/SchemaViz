<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchemaViz</title>
    <style>
        html, body {
            font-family: Arial, sans-serif;
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .tabs { display: flex; cursor: pointer; }
        .tab {
            padding: 10px;
            background-color: #f1f1f1;
            margin-right: 5px;
            display: inline-flex; 
            align-items: flex-start;
            vertical-align: top;
        }
        .tab-content {
            display: none;
            padding: 15px;
            border: 1px solid #ccc;
            height: calc(100vh - 200px);

            width: 95vw;
            /* overflow: auto; */
            overflow-x: auto;
            overflow-y: auto;


        }
        .tab-content.active { display: block; line-height: 1; }
        textarea { width: 100%; height: calc(100vh - 300px); margin-top: 10px; }
        button { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab" onclick="openTab('tab0')">
            <img src="img/logo.jpg" alt="SchemaViz" width="50" height="50">
            <b>SchemaViz</b>
        </div>
        <div class="tab" onclick="openTab('tab1')">Metadata</div>
        <div class="tab" onclick="openTab('tab2')">Data</div>
        <div class="tab" onclick="openTab('tab3')">Result</div>
    </div>

    <div id="tab0" class="tab-content">
        <h3>Home</h3>
        Home page
    </div>

    <div id="tab1" class="tab-content">
        <h3>Metadata.yaml</h3>
        <input type="file" id="file1" onchange="loadFile(event, 'metadata')">
        <textarea id="metadata"># Default Metadata.yaml content</textarea><br>
    </div>

    <div id="tab2" class="tab-content">
        <h3>Data.yaml</h3>
        <input type="file" id="file2" onchange="loadFile(event, 'data')">
        <textarea id="data"># Default Data.yaml content</textarea><br>
    </div>

    <div id="tab3" class="tab-content">
        <h3>Result</h3>
        <button onclick="sendYAML()">Send to API</button>
        <div id="result"></div><br>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    <script>
        function openTab(tabId) {
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        function loadFile(event, elementId) {
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById(elementId).value = reader.result;
            };
            reader.readAsText(event.target.files[0]);
        }

        function sendYAML() {
            const path = 'https://wb14u9093k.execute-api.eu-central-1.amazonaws.com/prod/viz'
            const metadata = document.getElementById('metadata').value;
            const data     = document.getElementById('data'    ).value;

            let param = { metadata, data };
            // console.log('0:', param);

            param = JSON.stringify(param);
            // console.log('1:', param);

            axios.post(path, param)
            .then(response => {
                    console.log(response.data);
                    document.getElementById('result').innerHTML = response.data["result"];
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').innerHTML = error;
                });
        }

        openTab('tab0');
    </script>
    <script>
        function loadYamlIntoTextarea(filePath, textareaId) {
            fetch(filePath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to fetch ${filePath}: ${response.statusText}`);
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById(textareaId).value = data;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        function loadYamls() {
            loadYamlIntoTextarea('./data/metadata.yaml', 'metadata');
            loadYamlIntoTextarea('./data/data.yaml', 'data');
        }

        window.onload = loadYamls;
    </script>

</body>
</html>
